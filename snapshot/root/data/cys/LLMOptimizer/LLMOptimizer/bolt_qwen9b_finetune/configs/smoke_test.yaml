### model
model_name_or_path: /jizhicfs/pkuhetu/bcxu/models/Qwen3.5-9B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /jizhicfs/pkuhetu/bcxu/LLMOptimizer/bolt_qwen9b_finetune/configs/ds_z3_config.json

### dataset
dataset_dir: /jizhicfs/pkuhetu/bcxu/LLMOptimizer/bolt_qwen9b_finetune/llamafactory_data
