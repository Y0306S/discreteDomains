### TaskSet CASH warm-start SFT (train838 TPE best configs).
### Hyperparameters copied from llamafactory_qwen35_9b_base_lora_sft_6_dl.yaml;
### only the dataset, dataset_dir and output_dir differ.
### Data: examples/benchmark/domains/build_taskset_warmstart_sft.py (llmoptimizer_benchmark).

### model
model_name_or_path: /root/eb-public/huggingface-models/Qwen/Qwen3.5-9B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.01
lora_target: all
loraplus_lr_ratio: 16.0

### dataset
dataset_dir: /root/data/cys/LLMOptimizer/LLMOptimizer/bolt_qwen9b_finetune/llamafactory_data
dataset: taskset_warmstart_train838
template: qwen3_5_nothink
cutoff_len: 3000
preprocessing_num_workers: 16
dataloader_num_workers: 8
overwrite_cache: true
packing: false

### output
output_dir: /root/data/cys/blockdata_archive/model-weights/llamafactory_qwen35_9b_lora_taskset_ws_train838
logging_steps: 1
save_steps: 9999
plot_loss: true
overwrite_output_dir: true
save_only_model: true
save_total_limit: 1
report_to: none

### train
per_device_train_batch_size: 4
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 10.0
lr_scheduler_type: cosine
neftune_noise_alpha: 5
warmup_steps: 20
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
