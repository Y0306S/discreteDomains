### model
# s1a DPO D1-micro (2-GPU): same D1 knobs + frozen ref via DeepSpeed ZeRO-3, half epoch
# Needs 2 GPUs because sigmoid DPO keeps a frozen reference model in memory.
model_name_or_path: /root/eb-public/huggingface-models/Qwen/Qwen3.5-9B
adapter_name_or_path: /root/data/cys/blockdata_archive/model-weights/llamafactory_qwen35_9b_lora_p5_s1a_ep7p5
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
deepspeed: /root/LLMOptimizer/LlamaFactory/examples/deepspeed/ds_z3_config.json
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
pref_beta: 0.05
pref_loss: sigmoid
pref_ftx: 0.25

### dataset
dataset_dir: /root/LLMOptimizer/LLMOptimizer/bolt_qwen9b_finetune/llamafactory_data
dataset: p5_s2_dpo
template: qwen3_5_nothink
cutoff_len: 6016
preprocessing_num_workers: 8
dataloader_num_workers: 2
overwrite_cache: true
packing: false

### output
output_dir: /root/data/cys/blockdata_archive/model-weights/llamafactory_qwen35_9b_lora_p5_s1a_ep7p5_dpo_D1m
logging_steps: 5
save_steps: 25
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_total_limit: 2
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
num_train_epochs: 0.5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
seed: 42
