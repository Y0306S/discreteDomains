### split note
# This _3 run uses the regenerated task-profile split:
# - train.jsonl: 532 records from 77 dataset/task profiles
# - validation.jsonl: 63 records from 9 held-out dataset/task profiles
# - test.jsonl: 63 records from 9 held-out dataset/task profiles
# The previous _2 run used a record-level train/validation split with no test set,
# so validation dataset profiles could also appear in training under other algorithms.
# In _3, dataset/task profiles are disjoint across train, validation, and test.
# The split is stratified by task type, keeping classification/regression coverage,
# and validation/test each contain 9 examples for every algorithm/model family.

### model
model_name_or_path: /jizhicfs/pkuhetu/bcxu/models/Qwen3.5-9B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target: all

### dataset
dataset_dir: /jizhicfs/pkuhetu/bcxu/LLMOptimizer/bolt_qwen9b_finetune/llamafactory_data
dataset: bolt_ml_warmstart_train_80
template: qwen3_5_nothink
cutoff_len: 2048
preprocessing_num_workers: 8
dataloader_num_workers: 2
overwrite_cache: true
packing: false

### output
output_dir: /jizhicfs/pkuhetu/bcxu/LLMOptimizer/bolt_qwen9b_finetune/outputs/llamafactory_qwen35_9b_base_lora_sft_3
logging_steps: 1
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_steps: 20
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null


