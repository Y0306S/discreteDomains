### model
# Peptide SFT peptide_s1b_winbatch10_ep7p5 -- Rationale+JSON target, winbatch10 arm (the batch of 10 containing the best sequence)
# Hyperparameters are copied verbatim from the winning ML recipe
# (llamafactory_qwen35_9b_lora_p5_s1b_ep7p5.yaml / _s1a_ep7p5.yaml), which is the config
# every downstream DPO/GRPO run was built on. Only dataset + cutoff_len + output_dir differ.
model_name_or_path: /root/eb-public/huggingface-models/Qwen/Qwen3.5-9B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
loraplus_lr_ratio: 16.0

### dataset
dataset_dir: /root/data/cys/blockdata_archive/llmoptimizer_benchmark/benchmark_data/rl_task_selection/peptide_sft_v2
dataset: peptide_sft_winbatch10
template: qwen3_5_nothink
# Measured max sequence length for this arm is well under 1024 tokens (rich prompt:
# p50 830, max 906). The ML configs used 6016 for much longer HPO prompts; 1024 here is
# ~6x less padding/compute per step with zero truncation.
cutoff_len: 1024
preprocessing_num_workers: 8
dataloader_num_workers: 2
overwrite_cache: true
packing: false

### output
output_dir: /root/data/cys/blockdata_archive/model-weights/llamafactory_qwen35_9b_lora_peptide_s1b_winbatch10_ep7p5
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: false
save_only_model: false
save_total_limit: 3
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.25e-4
num_train_epochs: 7.5
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
seed: 42
neftune_noise_alpha: 5
